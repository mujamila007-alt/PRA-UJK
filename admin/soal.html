<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manajemen Soal | Ujian BLK</title><link rel="stylesheet" href="/assets/style.css"></head><body class="admin-body"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

<main class="container page-enter"><div style="display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><span class="badge">BANK SOAL</span><h1>Manajemen Soal</h1><p class="muted">Tempel soal lengkap agar pertanyaan dan pilihan A–E terisi otomatis.</p></div><button id="import" class="btn-secondary" hidden>Impor 40 Soal PRA UJK</button></div>
<div class="card"><h2 id="form-title">Tambah Soal Baru</h2><div class="paste-box"><label>Tempel satu soal lengkap</label><textarea id="paste-question" placeholder="Pertanyaan ...&#10;a. Pilihan A&#10;b. Pilihan B&#10;c. Pilihan C&#10;d. Pilihan D&#10;e. Pilihan E&#10;Kunci: C"></textarea><div class="paste-status" id="paste-status">Teks akan diproses otomatis ketika ditempel atau diketik.</div></div><form id="question-form"><input type="hidden" id="qid"><div class="form-grid"><div class="full"><label>Pertanyaan</label><textarea id="pertanyaan" required></textarea></div><div><label>Pilihan A</label><input id="opt-a" required></div><div><label>Pilihan B</label><input id="opt-b" required></div><div><label>Pilihan C</label><input id="opt-c" required></div><div><label>Pilihan D</label><input id="opt-d" required></div><div><label>Pilihan E</label><input id="opt-e" required></div><div><label>Jawaban benar</label><select id="jawaban-benar"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div><div><label>Gambar soal (opsional, maks. 3 MB)</label><input type="file" id="gambar" accept="image/jpeg,image/png,image/webp"><img id="preview" class="question-image-preview" hidden></div></div><button id="save" type="submit">Simpan Soal</button> <button id="cancel" type="button" class="btn btn-ghost" hidden>Batal Edit</button></form></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>No.</th><th>Pertanyaan</th><th>Kunci</th><th>Aksi</th></tr></thead><tbody id="question-body"><tr><td colspan="4" class="loading-state">Memuat soal...</td></tr></tbody></table></div></div></main><script src="/assets/app.js"></script><script type="module" src="/assets/admin-soal.js"></script></body></html>
