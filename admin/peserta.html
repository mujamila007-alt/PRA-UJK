<main class="container page-enter"><span class="badge">PESERTA</span><h1>Manajemen Peserta</h1><p class="muted">Tambah dan kelola akun peserta. Peserta masuk menggunakan nama dan password.</p><div class="card"><h2 id="form-title">Tambah Peserta Baru</h2><form id="participant-form"><input type="hidden" id="uid"><div class="form-grid"><div><label>Nama login peserta</label><input id="nama" required autocomplete="off" maxlength="100" placeholder="Contoh: Budi Santoso"></div><div><label id="password-label">Password</label><input type="password" id="password" minlength="6" required></div><div><label>Status akun</label><select id="aktif"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div></div><button id="save" type="submit">Simpan Peserta</button> <button id="cancel" type="button" class="btn btn-ghost" hidden>Batal Edit</button></form></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Nama Login</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="participant-body"><tr><td colspan="3" class="loading-state">Memuat peserta...</td></tr></tbody></table></div></div></main><script src="/assets/app.js"></script><script type="module" src="/assets/admin-peserta.js"></script></body></html>
