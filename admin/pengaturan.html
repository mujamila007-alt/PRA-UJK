<main class="container page-enter"><span class="badge">KONFIGURASI</span><h1>Pengaturan Ujian</h1><p class="muted">Tentukan judul, instruksi, durasi, dan status akses ujian.</p><div class="card"><form id="settings-form"><label>Judul ujian</label><input id="judul" required><label>Durasi pengerjaan (menit)</label><input type="number" min="1" max="600" id="durasi" required><label>Instruksi peserta</label><textarea id="instruksi"></textarea><label>Status ujian</label><select id="status"><option value="aktif">Aktif — peserta dapat mulai</option><option value="nonaktif">Nonaktif — ujian ditutup</option></select><button id="save" type="submit">Simpan Pengaturan</button></form></div></main><script src="/assets/app.js"></script><script type="module" src="/assets/admin-pengaturan.js"></script></body></html>
